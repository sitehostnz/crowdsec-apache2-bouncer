name: ci

# Vet, test, a release-flags build check, and golangci-lint on every pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # Build with the same flags as the release, discarding the binary - a
      # compile check that the static release build still succeeds.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w' -o /dev/null .

      # golangci-lint has no apt package; go install builds it with the Go 1.26
      # we just set up, so the linter always matches the toolchain under test.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run --timeout 5m
