# EnvironmentFile for crowdsec-apache2-bouncer.service
# Install to /etc/crowdsec/bouncers/crowdsec-apache2-bouncer.conf  (chmod 600 - holds the key)

# CrowdSec LAPI. Use the local LAPI if this box runs the engine, else the remote one.
CROWDSEC_LAPI_URL=http://127.0.0.1:8080

# Bouncer key from:  cscli bouncers add apache-<hostname>
CROWDSEC_API_KEY=CHANGE_ME

# Directory for blocklist.txt + blocklist.dbm (and their temp files - kept in
# the same folder so the swap stays atomic). Also settable with the -dir flag,
# which takes precedence over this.
BLOCKLIST_DIR=/var/lib/crowdsec-apache2-bouncer

# Full-path overrides (rarely needed; trump BLOCKLIST_DIR/-dir entirely):
# OUTPUT_FILE=/var/lib/crowdsec-apache2-bouncer/blocklist.txt

# Map format Apache consumes:
#   dbm = O(1) hash lookup, scales to large/fast-changing lists (recommended)
#   txt = O(N) linear scan per cold lookup (fine only for small lists)
MAP_TYPE=dbm
# httxt2dbm builds the DBM (from apache2-utils on Debian/cPanel, httpd-tools on RHEL/Plesk).
HTTXT2DBM=httxt2dbm
# DBM output (default: OUTPUT_FILE with .dbm). Apache: RewriteMap ... dbm:<this>
# DBM_FILE=/var/lib/crowdsec-apache2-bouncer/blocklist.dbm

# Your own allowlist (bypass a ban) and blocklist (manual bans), kept here as
# allowlist.txt and denylist.txt. The daemon creates them empty if they're missing
# and - with MAP_TYPE=dbm - rebuilds the matching .dbm whenever you edit one, so
# there's no httxt2dbm step to remember. It never changes what's inside them.
# This follows wherever Apache's own config lives: /etc/apache2 on Debian/Ubuntu
# AND on cPanel (EasyApache 4 uses that path even on RHEL), /etc/httpd on
# RHEL/Alma Plesk boxes. The package picks whichever is present at install time and
# the unit allows both. Any OTHER directory under /etc must be added to
# ReadWritePaths= in the unit, because ProtectSystem=full makes /etc read-only to
# the service. Set this to nothing to leave the lists alone.
# See the README for the RewriteMap lines that put them to use.
CUSTOM_LIST_DIR=/etc/apache2/crowdsec

# Delta poll interval (seconds).
UPDATE_FREQUENCY=60

# LAPI query timeouts (seconds).
#   REQUEST_TIMEOUT        - connect + wait for the LAPI to start responding
#                            (fast-fail if it's unreachable/unresponsive).
#   STREAM_REQUEST_TIMEOUT - overall deadline for the decision-stream pull,
#                            including reading a large startup snapshot.
# REQUEST_TIMEOUT is nested inside STREAM_REQUEST_TIMEOUT, so keep it <= the stream
# timeout (it's capped to the stream timeout otherwise).
# REQUEST_TIMEOUT=10
# STREAM_REQUEST_TIMEOUT=15

# Max addresses to expand a single CIDR into - for BOTH IPv4 and IPv6 ranges (the
# cap is on the address count). 65536 = up to a /16 (IPv4) or /112 (IPv6). Lower it
# (e.g. 256 = /24 only) to bound file size; a range bigger than this is skipped and
# logged (use an ipset/firewall bouncer for those).
EXPAND_MAX_HOSTS=65536

# Which CrowdSec remediations to act on. Same name and values as the nginx
# bouncer, so one fleet needs one mental model:
#   ban     - only ban decisions          (default)
#   captcha - only captcha decisions
#   all     - every decision the LAPI sends
BOUNCING_ON_TYPE=ban

# What to do with a remediation this bouncer cannot express - an unsupported type
# like "throttle", or a captcha when no challenge is configured. Empty drops those
# decisions instead, which enforces nothing for them.
FALLBACK_REMEDIATION=ban

# Serve one remediation for EVERY decision, whatever type the LAPI returned.
# Empty (the default) honours each decision's own type.
#   OVERRIDE_REMEDIATION=captcha  -> challenge everything
#   OVERRIDE_REMEDIATION=ban      -> block everything
# Applied BEFORE the fallback, so overriding to captcha while the challenge is
# not configured still degrades to FALLBACK_REMEDIATION rather than enforcing
# nothing.
OVERRIDE_REMEDIATION=

# Each remediation that can be reached renders to its own map:
#   ban     -> blocklist.txt / blocklist.dbm  (OUTPUT_FILE / DBM_FILE)
#   captcha -> captcha.txt   / captcha.dbm    (same directory)
# Maps are derived from the three settings above - a map is written exactly when
# something can land in it.

# ---------------------------------------------------------------------------
# Captcha challenge listener. Unset CAPTCHA_LISTEN (the default) and none of this
# runs - a bouncer that only bans needs none of it.
#
# The listener binds to LOOPBACK and is reached through Apache, which is what
# puts the challenge on the customer's own hostname and TLS with no extra
# certificate. It must NOT be exposed directly: the address Apache reports is
# what a pass is recorded against, so a directly reachable listener would let
# anyone name their own address. See the README for the Apache half.
# Setting this ALONE is not enough: BOUNCING_ON_TYPE must also route captcha
# (=all or =captcha), and the captcha rules in blocklist.conf must be uncommented.
# With the shipped BOUNCING_ON_TYPE=ban nothing reaches the captcha map, so the
# listener is switched off with a warning rather than started - bans keep working.
# CAPTCHA_LISTEN=127.0.0.1:8125

# The path Apache proxies to the listener (must match the ProxyPass).
# CAPTCHA_PATH=/crowdsec-verify

# How long a solved challenge is honoured (seconds, minimum 60). This is the whole
# toll: a solve is obtainable at any time, so the captcha costs an address one
# proof-of-work per TTL. Shorten it to make that toll fall due more often.
# CAPTCHA_PASS_TTL=3600

# The map of solved challenges, which Apache reads ahead of the captcha map. It is
# a txt: map on purpose - Apache re-reads it the moment its mtime changes, so a
# solve goes live on the client's very next request. Defaults beside the ban map,
# under BLOCKLIST_DIR. It must not collide with any map the daemon writes; the
# daemon refuses to start if it does, because the file is reset at boot.
# CAPTCHA_PASS_FILE=/var/lib/crowdsec-apache2-bouncer/captcha_passed.txt

# Exists only while the listener is actually accepting, so Apache can branch on
# "the challenge is down" instead of discovering it by proxying into a 503. Lives
# under the unit's RuntimeDirectory=, so systemd removes it even on a hard kill.
# Set it empty to switch the signal off (then drop the -f cond from blocklist.conf).
# CAPTCHA_READY_FILE=/run/crowdsec-apache2-bouncer/challenge.up

# A pass is remembered against the solver's address, which covers every browser
# behind it - including everyone else sharing a NAT. Same as CrowdSec's own nginx
# bouncer.

# --- the challenge ------------------------------------------------------------
# Challenges are issued and verified in this process: no captcha service, no shared
# secret, nothing on the wire.
#
# REQUIRES HTTPS on any vhost that will be challenged. The widget uses
# crypto.subtle, which browsers expose only in a secure context, so on plain HTTP a
# challenged visitor can never solve. Keep those vhosts on FALLBACK_REMEDIATION=ban.
# CAPTCHA_WIDGET_JS=https://cdn.jsdelivr.net/npm/altcha@3.2.1/dist/main/altcha.js
#
# The digest the browser checks that script against. It defaults to the pinned
# build above, so leave BOTH of these alone and you get it for free. Pinning the
# version covers a bad upstream release; this covers the CDN serving something else
# entirely - script that would run on the customer's own origin, with their cookies.
#
# Change CAPTCHA_WIDGET_JS and this MUST change with it. A digest that does not
# match blocks the script outright, and a blocked widget is a challenge page that
# renders 200 and can never be solved. If you do not have the new digest, leave this
# line COMMENTED - only an empty value makes the daemon drop the attribute and warn
# at startup. A stale value here is used verbatim against the new URL - the daemon
# warns when it is the built-in digest below, but cannot tell a correct self-hosted
# mirror from a mistake, so it does not refuse either.
#   curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A
# CAPTCHA_WIDGET_SRI=sha384-brhp3NfINJBvUHF6gRWcBMLNYdQHko9s54cNvo7jLY0Ldzll9Ff1DG0JApAN83a4
# CAPTCHA_TOKEN_FIELD=altcha
#
# Work per attempt: PBKDF2 iterations, or digest rounds for the SHA family. Paid
# once by us when a challenge is minted, and ALTCHA_COMPLEXITY times by the
# visitor, so raising it costs both sides in step.
# ALTCHA_COST=5000
# How many attempts the visitor has to make. Paid only by the visitor - we do
# exactly one derivation whatever this is - so this dial costs the server nothing.
#
# These two MULTIPLY, and the defaults are matched to the nginx bouncer so a
# visitor meets the same check on either. Raising one without lowering the other
# bites hard: cost=5000 with complexity=100000 is a 35-second solve. The daemon
# logs the product at startup - read that line after any change.
# ALTCHA_COMPLEXITY=5000
#
# Which proof-of-work the widget is asked to run. Only names the published widget
# can solve are accepted; an unknown one falls back to the default with a startup
# warning, rather than failing silently in the browser or taking the daemon down.
# PBKDF2/SHA-256 by default, matching the nginx bouncer.
#   SHA-256 SHA-384 SHA-512 PBKDF2/SHA-256 PBKDF2/SHA-384 PBKDF2/SHA-512
# The two families cost the BROWSER very differently. PBKDF2 keeps its iterations
# inside one WebCrypto call, so ALTCHA_COST is nearly free in call count; the plain
# SHA names spend one awaited call PER ITERATION, so the same cost asks for
# thousands of times more calls and the widget times out at 90s with no error. A
# combination that cannot finish falls back to all three defaults with a startup
# warning, and the estimate is printed at start either way.
# If you pick a plain SHA name, leave ALTCHA_COST at 1 and use complexity instead.
# ALTCHA_ALGORITHM=PBKDF2/SHA-256

# Replace the built-in challenge page. Go html/template; see the README for the
# fields it is given.
# CAPTCHA_TEMPLATE=/etc/crowdsec/bouncers/challenge.html
# ---------------------------------------------------------------------------

# DEPRECATED: replaced by BOUNCING_ON_TYPE, and removed in a future release.
# Honoured only when BOUNCING_ON_TYPE is unset: true -> ban, false -> all. It warns
# at every start. ONLY_BAN=false is NOT what it used to be - it put every decision
# type into the ban map, where captcha decisions now render to their own and
# FALLBACK_REMEDIATION decides what happens when no challenge is configured.
# ONLY_BAN=true

# Periodic full re-sync (seconds) as a safety net against stream cursor drift.
# 0 disables it; any other value is held to 1h-24h (3600-86400), since a full
# snapshot is the expensive LAPI query and the deltas keep the list current between.
RESYNC_INTERVAL=21600

# TLS: leave both unset to verify against the system CA store (Let's Encrypt works).
# CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
# INSECURE=false

# --- metrics ------------------------------------------------------------------
# Prometheus exposition, OFF by default. Its own listener, deliberately: the
# challenge one is proxied to the public internet and this is not - bind it to
# loopback (or a management interface) and never proxy it from a customer vhost.
#
# The number worth alerting on is last_successful_poll_timestamp_seconds: the
# daemon can be up, polling and logging happily while the list it serves is hours
# stale, and nothing else here would show that. altcha_challenges_minted_total is
# the one to watch for challenge abuse - each mint is a KDF pass an unauthenticated
# caller asked for.
# METRICS_LISTEN=127.0.0.1:9876
# METRICS_PATH=/metrics
