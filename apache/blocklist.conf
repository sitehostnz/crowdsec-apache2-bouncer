# CrowdSec blocklist via mod_rewrite RewriteMap.
#
# RewriteMap MUST be in server (main) or virtualhost context - NOT .htaccess.
# Placement (see README for the full validated walkthrough + cross-vhost caveat):
#   cPanel: WHM -> Apache Configuration -> Include Editor -> Pre VirtualHost
#           Include -> All Versions, i.e.
#           /etc/apache2/conf.d/includes/pre_virtualhost_global.conf
#           PLUS per-vhost inheritance - server-context rewrite rules do NOT
#           reach cPanel vhosts on their own. Add to
#           /etc/apache2/conf.d/userdata/includename.conf:
#               RewriteEngine On
#               RewriteOptions InheritBefore
#           then: rebuildhttpdconf && restartsrv_httpd. Use InheritBefore (not
#           Inherit) so the block runs before any customer [L] rewrite.
#   Plesk : /etc/apache2/conf.d/zzz_crowdsec.conf  (Debian/Ubuntu)
#           /etc/httpd/conf.d/zzz_crowdsec.conf     (RHEL/Alma)  - adjust OUTPUT_FILE too
#           inheritance via the domain's Additional Apache directives /
#           vhost.conf, then: plesk sbin httpdmng --reconfigure-all
#
# ProxyPass is the exception: it IS inherited by vhosts automatically
# (ProxyPassInherit defaults to On), so the proxy lines below go here ONCE and
# must not be repeated per vhost.
#
# %{REMOTE_ADDR} must be the *real client IP*. Behind your CDN it's the edge IP
# unless mod_remoteip is trusting the CDN's X-Forwarded-For - see README.

RewriteEngine On
# DBM map = O(1) hash lookup (recommended; the daemon builds it with httxt2dbm).
RewriteMap crowdsec dbm:/var/lib/crowdsec-apache2-bouncer/blocklist.dbm
# txt alternative (O(N) linear scan per cold lookup; only for small lists):
#   RewriteMap crowdsec txt:/var/lib/crowdsec-apache2-bouncer/blocklist.txt

# Block if the client IP is in the map (value "1"); default "0" = allow.
RewriteCond ${crowdsec:%{REMOTE_ADDR}|0} =1
RewriteRule ^ - [F]

# ----------------------------------------------------------------------------
# CAPTCHA. Only needed when the daemon runs with BOUNCING_ON_TYPE=all (or captcha)
# AND CAPTCHA_LISTEN set. Replace the single block rule above with everything below.
#
# The daemon issues and verifies its own proof-of-work challenges - there is no
# captcha service, no shared secret and nothing to proxy to. It does require the
# vhost to be served over HTTPS: the widget uses crypto.subtle, which browsers only
# expose in a secure context, so on plain HTTP a challenged visitor can never solve.
#
# Three things here are not obvious, and each one is a real failure that has
# been hit rather than a precaution:
#
#  1. %{ENV:REDIRECT_STATUS} ^$ - act only on the ORIGINAL request. ErrorDocument
#     performs an internal redirect, which re-runs these rules against the error
#     page's own URI. Without this guard a challenged client hitting any error
#     page (cPanel's /503.shtml, say) is challenged again, which errors again:
#     an infinite redirect loop, not a block.
#
#  2. The readiness file - only send someone to the challenge while the daemon is
#     actually listening. Otherwise the redirect lands on a proxy with nothing
#     behind it, Apache answers 503, ErrorDocument turns that into an internal
#     redirect, and (1) becomes a loop. When it is down we refuse instead, which
#     is what FALLBACK_REMEDIATION=ban means at the Apache layer.
#
#  3. Nothing uses [L] to let a request THROUGH. With InheritBefore these rules
#     are prepended to the vhost's own, so an [L] here would also stop the
#     customer's rewrites - breaking WordPress permalinks and the like. Each rule
#     that stops a request therefore carries its full set of guards.
#
#  4. [B,NE] on the challenge redirect, and the capture cond above it. The return
#     target rides inside r=, so every character that means something in a query
#     string has to be encoded or the customer's own query breaks out of the
#     parameter: /search?q=a&b=c would arrive as r=/search?q=a plus a stray b=c.
#     The last RewriteCond captures path?query into %1 and [B] escapes that
#     backreference - &, =, + and ? all become %XX. [NE] then stops Apache
#     re-encoding the % signs into %25. Do not reach for ${escape:...} here: it is
#     an escaper for URI PATHS and leaves & = + alone, which is the bug this
#     replaces. Verified on 2.4.62 (AlmaLinux) and 2.4.68 (Debian).
#     With no query string the target ends in a bare "?", which the daemon trims.
# ----------------------------------------------------------------------------
#
#   RewriteMap captcha dbm:/var/lib/crowdsec-apache2-bouncer/captcha.dbm
#   RewriteMap solved  txt:/var/lib/crowdsec-apache2-bouncer/captcha_passed.txt
#
#   # A ban outranks a captcha, so the block rule stays FIRST.
#   RewriteCond %{ENV:REDIRECT_STATUS} ^$
#   RewriteCond %{REQUEST_URI} !^/crowdsec-verify
#   RewriteCond ${crowdsec:%{REMOTE_ADDR}|0} =1
#   RewriteRule ^ - [F]
#
#   # Challenge HTML navigations, while the daemon is up to answer them.
#   RewriteCond %{ENV:REDIRECT_STATUS} ^$
#   RewriteCond %{REQUEST_URI} !^/crowdsec-verify
#   RewriteCond ${solved:%{REMOTE_ADDR}|0}  !=1
#   RewriteCond ${captcha:%{REMOTE_ADDR}|0}  =1
#   RewriteCond %{HTTP_ACCEPT} text/html
#   RewriteCond /run/crowdsec-apache2-bouncer/challenge.up -f
#   # LAST cond: %1 below comes from it. Always matches; it captures, it does not filter.
#   RewriteCond %{REQUEST_URI}?%{QUERY_STRING} ^(.*)$
#   RewriteRule ^ /crowdsec-verify?r=%1 [B,R=302,L,NE]
#
#   # Anything else from a challenged client - and everything, once the daemon is
#   # down - is refused rather than redirected.
#   RewriteCond %{ENV:REDIRECT_STATUS} ^$
#   RewriteCond %{REQUEST_URI} !^/crowdsec-verify
#   RewriteCond ${solved:%{REMOTE_ADDR}|0}  !=1
#   RewriteCond ${captcha:%{REMOTE_ADDR}|0}  =1
#   RewriteRule ^ - [F]
#
#   # The listener. There is no captcha service to proxy to - the daemon issues
#   # and checks its own challenges.
#   # No trailing slash on either side. With one on the target, a subpath such as
#   # /crowdsec-verify/altcha-challenge maps to //altcha-challenge, which the
#   # daemon answers with a 307 to a path OUTSIDE the proxy prefix - and the
#   # rewrite rules above then refuse it. The widget never gets a challenge and
#   # the page hangs with nothing logged on either side.
#   ProxyPass        /crowdsec-verify http://127.0.0.1:8125
#   ProxyPassReverse /crowdsec-verify http://127.0.0.1:8125
#
#   Those two lines are the whole of it. The daemon reads the address off the
#   X-Forwarded-For that mod_proxy appends itself, so there is no header to set and
#   mod_headers is not needed. It reads only the LAST entry, which is the one
#   Apache wrote - anything the client put there sits in front of it and is
#   ignored.
#
#   REQUIRED: ProxyAddHeaders must stay On (its default), and nothing may strip
#   X-Forwarded-For on this location. Turn it off - or add a `RequestHeader unset
#   X-Forwarded-For` here - and Apache appends nothing while still forwarding
#   whatever the client sent, so the daemon reads a header the CLIENT wrote and
#   anyone can record a pass against an address they do not control. The daemon
#   cannot detect this: through the proxy the peer is loopback either way.
#
# ----------------------------------------------------------------------------
# Optional extras (see README for the full detail). Uncomment as needed.
#
# 1) Return 429 instead of 403 - matches the official mod_crowdsec bouncer and
#    makes blocks easy to tell apart from application 403s in the logs. [F] is
#    just shorthand for 403; swap the RewriteRule above for:
#      RewriteRule ^ - [R=429,L]
#      ErrorDocument 429 /crowdsec-blocked.html
#      Header always set Retry-After "600" "expr=%{REQUEST_STATUS} == 429"
#
# 2) Friendlier blocked page. ErrorDocument takes a URL-path (not a filesystem
#    path), and the banned IP must be allowed to fetch the page itself - so
#    exempt it from the block first:
#      RewriteCond %{REQUEST_URI} !^/crowdsec-blocked\.html$
#      RewriteCond ${crowdsec:%{REMOTE_ADDR}|0} =1
#      RewriteRule ^ - [F]
#      Alias /crowdsec-blocked.html /var/lib/crowdsec-apache2-bouncer/crowdsec-blocked.html
#      <Directory /var/lib/crowdsec-apache2-bouncer>
#          Require all granted
#      </Directory>
#      ErrorDocument 403 /crowdsec-blocked.html
#
# 3) Dedicated block log. Tag matches with an env var, then log conditionally.
#    Set the flag on the block rule and define the format here (global context):
#      RewriteRule ^ - [F,E=CROWDSEC_BLOCK:1]
#      LogFormat "%v %h %t \"%r\" %>s \"%{User-Agent}i\"" crowdsec_block
#    NOTE (cPanel): the matching CustomLog line must live in VHOST context - put
#    it in the same userdata/includename.conf, because a vhost that defines any
#    CustomLog (every cPanel domlog does) ignores all global ones. When the page
#    is served via ErrorDocument, match the internal redirect too:
#      CustomLog /var/log/crowdsec_block.log crowdsec_block \
#        "expr=env('CROWDSEC_BLOCK') == '1' || env('REDIRECT_CROWDSEC_BLOCK') == '1'"
#
# 4) Local allowlist + your own blocklist. Two maps you maintain, checked
#    alongside CrowdSec's: the allowlist bypasses a block; your own blocklist adds
#    manual bans CrowdSec doesn't know about. The daemon creates both files empty
#    (CUSTOM_LIST_DIR, beside Apache's own config: /etc/apache2/crowdsec on
#    Debian and cPanel, /etc/httpd/crowdsec on RHEL-family Plesk) and rebuilds
#    their .dbm whenever you edit one, so use dbm: here if the
#    CrowdSec map above does. Declare both up top, next to "RewriteMap crowdsec":
#      RewriteMap local_allow dbm:/etc/apache2/crowdsec/allowlist.dbm
#      RewriteMap local_deny  dbm:/etc/apache2/crowdsec/denylist.dbm
#    (txt: straight off the .txt works too, and needs no rebuild at all - the
#    lists are usually small enough that the linear scan costs nothing.)
#    then REPLACE the block cond/rule above with these two - each blocks only when
#    the client is NOT allow-listed (the allowlist always wins):
#      RewriteCond ${local_allow:%{REMOTE_ADDR}|0} !=1
#      RewriteCond ${crowdsec:%{REMOTE_ADDR}|0}    =1
#      RewriteRule ^ - [F]
#      RewriteCond ${local_allow:%{REMOTE_ADDR}|0} !=1
#      RewriteCond ${local_deny:%{REMOTE_ADDR}|0}  =1
#      RewriteRule ^ - [F]
#    Add the same allow guard to the captcha rules above if you use both.
#    Map files are "<ip> 1" per line, exact match (canonical IPv6). A RewriteMap
#    can't match CIDR - for a range, use an expression instead, e.g. bypass one:
#      RewriteCond expr "! (%{REMOTE_ADDR} -ipmatch '203.0.113.0/24')"
#      RewriteCond ${crowdsec:%{REMOTE_ADDR}|0} =1
#      RewriteRule ^ - [F]
#    Editing a list needs no reload (with dbm: it goes live once the daemon has
#    rebuilt it); adding a RewriteMap directive does.
#
# 5) RATE LIMIT THE CHALLENGE. Recommended wherever you enable captcha. The
#    challenge endpoint is reachable by exactly the traffic already judged
#    hostile, and it is the one place a request costs the daemon real CPU: a GET
#    from an address with no challenge outstanding runs a full KDF pass to mint
#    one. The daemon bounds this per ADDRESS (the same challenge comes back until
#    it is solved or expires, concurrent mints are capped at half the CPUs, and it
#    refuses new challenges past 200k outstanding) - but nothing bounds the
#    REQUEST RATE, so an address-hopping flood still drives mints. Apache is the
#    right layer for that. Watch crowdsec_apache_bouncer_altcha_challenges_minted_total
#    on METRICS_LISTEN to see whether it is happening.
#
#    With mod_ratelimit (ships with httpd; throttles bandwidth, not requests) this
#    is the wrong tool. Use mod_qos, mod_evasive, or mod_security if you have one.
#    mod_evasive is the usual cPanel/Plesk answer - per-vhost, no extra maps:
#      <Location /crowdsec-verify>
#          DOSPageCount        6
#          DOSPageInterval     2
#          DOSBlockingPeriod   60
#      </Location>
#    A firewall-level limit works just as well, and is often already in place:
#      iptables -A INPUT -p tcp --dport 443 -m hashlimit \
#        --hashlimit-name cs_verify --hashlimit-above 30/min --hashlimit-mode srcip -j DROP
#    Do NOT rate limit so hard that a legitimate challenged visitor cannot load the
#    page and fetch one challenge - that is a block, not a captcha. A handful of
#    requests per second per address is ample: a real solve is one GET of the page,
#    one GET of the challenge, and one POST.
#
# 6) SELF-HOSTED WIDGET SCRIPT. Only needed if you point CAPTCHA_WIDGET_JS at your
#    own origin instead of the pinned CDN build (the default needs nothing here).
#    A <script type="module"> request sends "Accept: */*", so it does NOT match the
#    text/html cond on the challenge rule - it falls through to the refuse rule and
#    is 403'd for exactly the clients that need it, leaving the widget unable to
#    load and the page stuck on "Verifying your connection". Exempt the asset path
#    AHEAD of the block rules, in the same way /crowdsec-verify already is - add its
#    path to the guard on each of the three rules above:
#      RewriteCond %{REQUEST_URI} !^/crowdsec-(verify|assets/)
#    and serve it from that prefix, e.g.:
#      Alias /crowdsec-assets/ /var/www/crowdsec-assets/
#      <Directory /var/www/crowdsec-assets>
#          Require all granted
#      </Directory>
#    then CAPTCHA_WIDGET_JS=https://<host>/crowdsec-assets/altcha.js with a
#    CAPTCHA_WIDGET_SRI digest of that exact file.
# ----------------------------------------------------------------------------
